# JanusX86: Janus' hand-written amd64 model checked against the Sail x86 model (translated from
# ACL2 X86isa) inside Lean. A separate Lake package so that the main Janus library depends
# neither on the Sail Lean library nor on the generated model. See docs/X86FORMAL.md.
name = "janusx86"
version = "0.1.0"
defaultTargets = ["JanusX86", "janus-x86-check"]

[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
# lean-sail tag v7, the same pin as JanusASL (builds unchanged on Lean 4.34.1)
rev = "8fc8e29d7a62f832346cc7548953e44ec17bc271"

[[require]]
name = "janus"
path = ".."

# rems-project/sail-x86-from-acl2's model sliced to the opcodes Janus decodes, generated by
# Sail 0.20.3's Lean backend (`scripts/x86formal.sh gen`); unpacked from
# vendor/X86Sail.tar.gz by `scripts/x86formal.sh`.
[[lean_lib]]
name = "X86Sail"
moreLeanArgs = ["--tstack=400000"]
moreLeancArgs = ["-fbracket-depth=100000"]
leanOptions.weak.linter.style.nameCheck = false

[[lean_lib]]
name = "JanusX86"
roots = ["JanusX86.Proofs"]

[[lean_exe]]
name = "janus-x86-check"
root = "JanusX86.Check"
moreLeancArgs = ["-fbracket-depth=100000"]
