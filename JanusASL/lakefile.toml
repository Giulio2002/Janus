# JanusASL: Janus' hand-written AArch64 model checked against Arm's ASL inside Lean.
# A separate Lake package so that the main Janus library does not depend on the Sail Lean
# library or on the (large) generated model. See docs/ASL.md.
name = "janusasl"
version = "0.1.0"
defaultTargets = ["JanusASL", "janus-asl-check"]

[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
# lean-sail tag v7 (builds unchanged on Lean 4.34.1; v6, Sail 0.20.3's default, does not)
rev = "8fc8e29d7a62f832346cc7548953e44ec17bc271"

[[require]]
name = "janus"
path = ".."

# The sail-arm arm-v9.4-a model sliced to the Janus subset, generated by Sail 0.20.3's Lean
# backend (`scripts/asl.sh gen`); unpacked from vendor/ArmASL.tar.gz by `scripts/asl.sh`.
[[lean_lib]]
name = "ArmASL"
moreLeanArgs = ["--tstack=400000"]
moreLeancArgs = ["-fbracket-depth=100000"]
leanOptions.weak.linter.style.nameCheck = false

[[lean_lib]]
name = "JanusASL"
roots = ["JanusASL.Proofs", "JanusASL.Classify", "JanusASL.Verify"]

[[lean_exe]]
name = "janus-asl-check"
root = "JanusASL.Check"
moreLeancArgs = ["-fbracket-depth=100000"]
