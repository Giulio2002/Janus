# The print/println example proofs (R8) as a consumer package: janus verify --proof-root
# examples/proofs-print (scripts/verify-print-examples.sh). Every module imports `Extracted`, the
# module `janus verify` generates from an artifact directory, so none of them builds with a plain
# `lake build`; the per-function lemma modules (PrintProofs.<Isa>.Fn*) are built once per
# extraction and shared by the four theorems of an example (and by every `janus verify` run).
name = "printProofs"

[[require]]
name = "janus"
path = "../.."

[[lean_lib]]
name = "PrintProofs"
