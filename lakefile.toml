name = "janus"
version = "0.1.0"
defaultTargets = ["Janus"]

[[lean_lib]]
name = "Janus"

[[lean_lib]]
name = "JanusTests"

[[lean_exe]]
name = "janus-oracle"
root = "Oracle.Main"

[[lean_exe]]
name = "janus-decode"
root = "Janus.Tools.Decode"

[[lean_exe]]
name = "janus-oracle-amd64"
root = "Oracle.Amd64Main"

# The trusted auditor that `janus verify` runs (Janus/Tools/AuditMain.lean; imports only Lean).
[[lean_exe]]
name = "janus-audit"
root = "Janus.Tools.AuditMain"
supportInterpreter = true

[[lean_exe]]
name = "janus-testfloat"
root = "Oracle.TestFloat"
