[package]
name = "janus-oracle-sail"
version = "0.1.0"
edition = "2021"
description = "Run Janus oracle cases (oracle/layout) on the Sail arm-v9.4-a (Arm ASL) model at EL0"
publish = false

[[bin]]
name = "janus-oracle-sail"
path = "src/main.rs"

[dependencies]
# Pinned: Sail arm-v9.4-a model embedded as a single-step oracle (vendored C++ model,
# generated by Sail 0.20.1 from rems-project/sail-arm). See docs/ORACLE-SAIL.md.
sail-aarch64-oracle = { git = "https://github.com/yufengzjj/sail-aarch64-oracle", rev = "2dffc81de96705d087b72a57047dd4589c6fb548", features = ["system-gmp"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 2
debug = false
