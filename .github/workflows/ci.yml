name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"

jobs:
  guard:
    name: Axiom/sorry guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No sorry / native_decide / bv_decide / admit
        run: scripts/ci-axiom-guard.sh

  go-test:
    name: Lean build, go vet, go test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install qemu-user, aarch64 binutils and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user binutils-aarch64-linux-gnu bubblewrap

      # janus verify sandboxes the proof under bubblewrap, which needs an unprivileged user
      # namespace. GitHub's Ubuntu 24.04 runners restrict those via AppArmor; lift the restriction
      # so the sandbox self-test passes. (Verification refuses to run without a sandbox unless
      # --unsafe-no-sandbox is passed.)
      - name: Allow unprivileged user namespaces (for the verify sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-all --dev /dev --proc /proc --tmpfs /tmp true \
            && echo "bubblewrap works" || echo "WARNING: bubblewrap self-test failed"

      # Memory guard: janus and scripts/lib/memguard.sh run every Lean job (lean, leanchecker,
      # lake, go test) inside a cgroup v2 memory limit, through `systemd-run --user --scope`.
      # GitHub's runners have systemd but no user manager for the runner account until it lingers;
      # start one and export its runtime dir. Without it the guard degrades to prlimit (or none)
      # and says so in the log. JANUS_MEM_MAX: the default per-job limit is min(24G, 40% of RAM),
      # 6.4 GiB on a 16 GiB runner, below a cold framework replay (6.5 GiB); one job runs at a
      # time here, so give it 12G.
      - name: Memory guard (cgroup v2 limit for every Lean job)
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)" || true
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "JANUS_MEM_MAX=12G" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" JANUS_MEM_MAX=12G
          echo "memguard mechanism: $(bash scripts/lib/memguard.sh mechanism)"
          bash scripts/lib/memguard.sh run -l 1G -n ci-probe -- true
          go run ./cmd/janus memguard || true

      # elan installs the toolchain pinned in lean-toolchain on first use.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-

      - name: lake build Janus JanusTests
        run: bash scripts/lib/memguard.sh lake build Janus JanusTests

      - name: go vet
        run: go vet ./...

      - name: Build examples
        run: scripts/build-examples.sh

      # The Lean-running tests take longer than go test's default 10-minute timeout. The
      # independent ones are marked parallel; TestMain caps -parallel by memory (min(cores/4,
      # (MemAvailable - 32 GiB)/20 GiB), at least 1), which is 1 on a 4-core 16 GiB runner.
      - name: go test ./cmd/...
        run: bash scripts/lib/memguard.sh run -n go-test -- go test -timeout 40m ./cmd/...

  # The arm64 example proofs, decoder coverage, the qemu oracle and the docs/AUDIT.md attacks.
  arm64:
    name: arm64 example proofs, oracle, soundness audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install qemu-user, aarch64 binutils and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user binutils-aarch64-linux-gnu bubblewrap

      # janus verify sandboxes the proof under bubblewrap, which needs an unprivileged user
      # namespace. GitHub's Ubuntu 24.04 runners restrict those via AppArmor; lift the restriction
      # so the sandbox self-test passes. (Verification refuses to run without a sandbox unless
      # --unsafe-no-sandbox is passed.)
      - name: Allow unprivileged user namespaces (for the verify sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-all --dev /dev --proc /proc --tmpfs /tmp true \
            && echo "bubblewrap works" || echo "WARNING: bubblewrap self-test failed"

      # Memory guard: janus and scripts/lib/memguard.sh run every Lean job (lean, leanchecker,
      # lake, go test) inside a cgroup v2 memory limit, through `systemd-run --user --scope`.
      # GitHub's runners have systemd but no user manager for the runner account until it lingers;
      # start one and export its runtime dir. Without it the guard degrades to prlimit (or none)
      # and says so in the log. JANUS_MEM_MAX: the default per-job limit is min(24G, 40% of RAM),
      # 6.4 GiB on a 16 GiB runner, below a cold framework replay (6.5 GiB); one job runs at a
      # time here, so give it 12G.
      - name: Memory guard (cgroup v2 limit for every Lean job)
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)" || true
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "JANUS_MEM_MAX=12G" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" JANUS_MEM_MAX=12G
          echo "memguard mechanism: $(bash scripts/lib/memguard.sh mechanism)"
          bash scripts/lib/memguard.sh run -l 1G -n ci-probe -- true
          go run ./cmd/janus memguard || true

      # elan installs the toolchain pinned in lean-toolchain on first use.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-arm64-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-arm64-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-

      - name: lake build Janus JanusTests
        run: bash scripts/lib/memguard.sh lake build Janus JanusTests

      # Builds and extracts the examples itself (scripts/build-examples.sh). JANUS_ROOT: verify
      # against this checkout's Janus build (made above) instead of building the embedded copy of
      # the same sources a second time in ~/.cache/janus; the checks are the same (the embedded
      # path is covered by go test). Proofs at once: scripts/lib/parallel.sh (memory-bounded).
      - name: Verify example proofs
        env:
          JANUS_ROOT: ${{ github.workspace }}
        run: scripts/verify-examples.sh

      - name: Decoder coverage of the examples (janus blockers)
        run: |
          go build -o bin/janus ./cmd/janus
          mapfile -t syms < <(bin/janus list artifacts/examples-arm64 --filter example.com/basic. | awk 'NR > 2 { print $3 }')
          n=${#syms[@]}
          [ "$n" -gt 0 ] || { echo "no example functions found" >&2; exit 1; }
          bin/janus blockers artifacts/examples-arm64 "${syms[@]}" | tee blockers.txt
          # Every example must decode fully, except the store-exclusive fallback loops that Go
          # emits next to the LSE path in sync/atomic callers. The model rejects STXR/STLXR by
          # design (spurious failure is not modelled, docs/SOUNDNESS.md); the proofs take the
          # LSE path under runtime.arm64HasATOMICS. Any other rejected word fails the job.
          allowed='^ +0x[0-9a-f]+ +0x[0-9a-f]+ +stl?xr .* example\.com/basic\.(AtomicAdd|AtomicMax)$'
          if grep -E '^ +0x[0-9a-f]+ +0x[0-9a-f]{8} ' blockers.txt | grep -Ev "$allowed"; then
            echo "unexpected rejected words (above)" >&2; exit 1
          fi
          grep -Eq "Summary: $n symbol\(s\): $((n - 2)) fully decoded" blockers.txt ||
            grep -q "Summary: $n symbol(s): $n fully decoded" blockers.txt

      - name: Differential oracle vs qemu (quick)
        env:
          OUT: ${{ runner.temp }}/oracle
        run: |
          scripts/oracle.sh quick
          # oracle.sh reports mismatches but exits 0; fail the job on any soundness mismatch.
          if grep -q '"verdict":"MISMATCH"' "$OUT/verdicts.jsonl"; then
            cat "$OUT/repro.md" || true
            exit 1
          fi

      - name: Upload oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-quick
          path: ${{ runner.temp }}/oracle/*.md
          if-no-files-found: ignore

      # Every "blocked" row must be rejected and every Verified / Verified-honest / mitigated
      # control must verify; run-all.sh marks a regression BROKEN and exits non-zero.
      - name: Soundness audit attacks (audit/run-all.sh, rows in parallel)
        run: audit/run-all.sh

  # The amd64 backend: Lean model + oracle executable, the amd64 example proofs, and the native
  # differential oracle. Runs in parallel with the other jobs.
  amd64:
    name: amd64 Lean targets, example proofs, native oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            oracle-amd64/go.sum

      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap

      # janus verify sandboxes the proof under bubblewrap, which needs an unprivileged user
      # namespace. GitHub's Ubuntu 24.04 runners restrict those via AppArmor; lift the restriction
      # so the sandbox self-test passes. (Verification refuses to run without a sandbox unless
      # --unsafe-no-sandbox is passed.)
      - name: Allow unprivileged user namespaces (for the verify sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-all --dev /dev --proc /proc --tmpfs /tmp true \
            && echo "bubblewrap works" || echo "WARNING: bubblewrap self-test failed"

      # Memory guard: janus and scripts/lib/memguard.sh run every Lean job (lean, leanchecker,
      # lake, go test) inside a cgroup v2 memory limit, through `systemd-run --user --scope`.
      # GitHub's runners have systemd but no user manager for the runner account until it lingers;
      # start one and export its runtime dir. Without it the guard degrades to prlimit (or none)
      # and says so in the log. JANUS_MEM_MAX: the default per-job limit is min(24G, 40% of RAM),
      # 6.4 GiB on a 16 GiB runner, below a cold framework replay (6.5 GiB); one job runs at a
      # time here, so give it 12G.
      - name: Memory guard (cgroup v2 limit for every Lean job)
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)" || true
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "JANUS_MEM_MAX=12G" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" JANUS_MEM_MAX=12G
          echo "memguard mechanism: $(bash scripts/lib/memguard.sh mechanism)"
          bash scripts/lib/memguard.sh run -l 1G -n ci-probe -- true
          go run ./cmd/janus memguard || true

      # elan installs the toolchain pinned in lean-toolchain on first use.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
            sh elan-init.sh -y --default-toolchain none
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-amd64-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lake-amd64-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-

      - name: lake build Janus JanusTests janus-oracle-amd64
        run: bash scripts/lib/memguard.sh lake build Janus JanusTests janus-oracle-amd64

      # verify-amd64-examples.sh first runs scripts/build-examples-amd64.sh (build the linux/amd64
      # examples binary and extract every function into artifacts/amd64/).
      - name: Build, extract and verify the amd64 example proofs
        env:
          JANUS_ROOT: ${{ github.workspace }}
        run: scripts/verify-amd64-examples.sh

      # The native oracle single-steps each case in-process with RFLAGS.TF and a raw SIGTRAP
      # handler, behind a seccomp-BPF filter (no ptrace, no privileges, no perf counters), so it
      # runs on GitHub's x86-64 VMs. Only flags and results the model claims are compared, and
      # the model leaves vendor-dependent flags undefined, so an AMD EPYC runner is as valid a
      # reference as the Intel development host. The script exits non-zero on any MISMATCH.
      - name: Differential oracle vs native x86-64 (quick)
        env:
          OUT: ${{ runner.temp }}/oracle-amd64
          JOBS: "4"
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          scripts/oracle-amd64.sh quick

      - name: Upload amd64 oracle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-amd64-quick
          path: ${{ runner.temp }}/oracle-amd64/*.md
          if-no-files-found: ignore
