name: ASL equivalence

# Builds the Lean translation of Arm's ASL (vendored, JanusASL/vendor/ArmASL.tar.gz) and checks the
# kernel-checked equivalence theorems between it and the Janus arm64 model (docs/ASL.md), then runs
# `janus verify --asl` on the shipped Add, Max, Mul64 and Add128 proofs: each one's ASL corollary is
# derived from its artifacts, audited and kernel-replayed. The model build takes about an hour, so
# this runs weekly, on demand, and when the arm64 model, JanusASL or the verifier changes, rather
# than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "Janus/Arm64/**"
      - "Janus/GoABI.lean"
      - "Janus/Tools/Audit.lean"
      - "JanusASL/**"
      - "cmd/janus/**"
      - "examples/proofs/Add.lean"
      - "examples/proofs/Max.lean"
      - "examples/proofs/Mul64.lean"
      - "examples/proofs/Add128.lean"
      - "scripts/asl.sh"
      - ".github/workflows/asl.yml"

permissions:
  contents: read

jobs:
  asl:
    name: Build ArmASL and audit the equivalence theorems
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GO_VERSION: "1.26.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # janus verify sandboxes the proof under bubblewrap (see ci.yml).
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --ro-bind / / --unshare-all --dev /dev --proc /proc --tmpfs /tmp true \
            && echo "bubblewrap works" || echo "WARNING: bubblewrap self-test failed"

      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Memory guard: janus and scripts/lib/memguard.sh run every Lean job (lean, leanchecker,
      # lake, go test) inside a cgroup v2 memory limit, through `systemd-run --user --scope`.
      # GitHub's runners have systemd but no user manager for the runner account until it lingers;
      # start one and export its runtime dir. Without it the guard degrades to prlimit (or none)
      # and says so in the log. JANUS_MEM_MAX: the default per-job limit is min(24G, 40% of RAM),
      # 6.4 GiB on a 16 GiB runner: tight for the ArmASL build (10.7 GiB with 8 lake jobs) and the
      # ClearWords proof (4.8 GiB). One job runs at a time here, so give it 12G (docs/TESTING.md).
      - name: Memory guard (cgroup v2 limit for every Lean job)
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)" || true
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "JANUS_MEM_MAX=12G" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$uid" JANUS_MEM_MAX=12G
          echo "memguard mechanism: $(bash scripts/lib/memguard.sh mechanism)"
          bash scripts/lib/memguard.sh run -l 1G -n ci-probe -- true

      - name: Cache the ArmASL build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            JanusASL/.lake
          key: asl-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'JanusASL/vendor/ArmASL.tar.gz', 'JanusASL/lakefile*', 'JanusASL/lake-manifest.json') }}

      - name: Build ArmASL, JanusASL and janus-asl-check
        run: scripts/asl.sh build

      - name: Audit the equivalence theorems (only propext, Classical.choice, Quot.sound)
        run: |
          scripts/asl.sh prove | tee audit.txt
          grep -q "only propext, Classical.choice, Quot.sound" audit.txt

      # janus verify --asl on the four examples: the corollary of each shipped theorem, derived
      # from the artifacts (the same Extracted.program that is identity-checked), audited and
      # kernel-replayed (ArmASL, lean-sail and JanusASL included). The JanusASL build in janus'
      # cache is seeded from the one above.
      - name: janus verify --asl (Add, Max, Mul64, Add128)
        run: |
          scripts/asl.sh verify | tee verify-asl.txt
          test "$(grep -c ': ASL corollary verified' verify-asl.txt)" = 4

      - name: Upload the ASL verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asl-verify
          path: |
            artifacts/asl/verify-*.log
            artifacts/*/verified.json
